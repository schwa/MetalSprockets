        public func visibleFunctionTable(_ name: String, functionType: MTLFunctionType? = nil, functions: [VisibleFunction]) -> some Element
      doc: |-
        Binds a visible function table containing the specified functions.

        Use this modifier to bind stitched or visible functions to a shader.
        The binding index is resolved from reflection using the parameter name.

        The modifier works inside both ``RenderPipeline`` and ``ComputePipeline``
        content blocks. For render pipelines, pass `.vertex` or `.fragment` (or
        omit `functionType` to auto-detect from reflection). For compute
        pipelines, the function type is always `.kernel`.

        ```swift
        // Render pipeline
        RenderPipeline(vertexShader: vs, fragmentShader: fs) {
            Draw { encoder in ... }
                .visibleFunctionTable("colorFunction", functions: [stitchedFunction])
        }
        .linkedFunctions([stitchedFunction])

        // Compute pipeline
        ComputePipeline(computeKernel: kernel) {
            ComputeDispatch(threadsPerGrid: size, threadsPerThreadgroup: tg)
                .visibleFunctionTable("snippetFunctions", functions: [snippetFunction])
        }
        .environment(\.linkedFunctions, linkedFunctions)
        ```

        - Parameters:
          - name: The name of the visible function table parameter in the shader.
          - functionType: The shader stage (`.vertex`, `.fragment`, or `.kernel`). If nil, auto-detected from reflection.
          - functions: The Metal functions to include in the table.
        - Returns: A modified element with the visible function table bound.
      source: Sources/MetalSprockets/Metal/VisibleFunctionTableModifier.swift:38
    - decl: |
        public func workloadEnabled(_ enabled: Bool = true) -> some Element
      doc: |-
        Controls whether this element's subtree participates in the workload phase.

        When `enabled` is `false`, neither this element nor any of its descendants
        have their workload phase run (no draws, dispatches, or blits). The setup
        phase still runs, so pipeline states and other setup-phase resources stay
        built — toggling the flag is cheap and does not cause a rebuild.

        Useful for debug toggles, A/B comparisons, and effect bypass switches
        where you want to keep everything warm but temporarily suppress output.

        ```swift
        MyExpensiveEffect()
            .workloadEnabled(showEffect)
        ```

        If you want to remove an element from the tree entirely (triggering
        teardown of its resources), use a plain `if`/`ConditionalContent` instead.

        - Parameter enabled: Whether the subtree's workload phase runs. Defaults to `true`.
      source: Sources/MetalSprockets/Core/WorkloadEnabledModifier.swift:37
  - decl: public protocol MSDynamicProperty
    doc: |-
      A property wrapper that participates in an element's update pass.

      `MSDynamicProperty` is analogous to SwiftUI's `DynamicProperty`. The System discovers
      conforming property wrappers on an element and gives them two chances to act around each
      update: ``update(in:)`` before the element's body is evaluated, and ``persist(in:)`` after.

      ## Overview

      The built-in wrappers (``MSState``, ``MSObservedObject``) conform to this protocol. Adopt it
      to write your own wrapper that needs per-node storage, dependency registration, or
      environment access:

      ```swift
      @propertyWrapper
      struct FrameCounter: MSDynamicProperty {
          private let box = Box(0)

          var wrappedValue: Int { box.value }

          func update(in context: MSDynamicPropertyContext) {
              box.value = (context.persistedValue(forKey: context.label) as? Int ?? 0) + 1
          }

          func persist(in context: MSDynamicPropertyContext) {
              context.setPersistedValue(box.value, forKey: context.label)
          }
      }
      ```

      Both requirements have default no-op implementations, so conformers only implement the phase
      they need.

      ## Topics

      ### Related Types
      - ``MSDynamicPropertyContext``
    source: Sources/MetalSprockets/Core/DynamicProperty.swift:39
