    - decl: |
        public func gpuCounters(label: String? = nil, _ handler: @escaping @Sendable (GPUCounterSample) -> Void) -> some Element
      doc: |-
        Samples GPU timestamps around the first render or compute pass inside this element and reports them after the
        submission completes.

        ```swift
        try RenderPass {
            // ...
        }
        .gpuCounters(label: "Main") { sample in
            logger.info("GPU: \((sample.duration ?? 0) * 1000) ms")
        }
        ```

        On Metal 4 a render pass reports its whole duration and a ``GPUCounterSample/vertex`` interval; the fragment
        interval is always `nil`. Failed or discarded work reports nothing. `handler` runs on the completion executor.
      source: Sources/MetalSprockets/Metal/GPUCounters.swift:83
    - decl: |
        public func id<ID>(_ id: ID) -> some Element where ID : Hashable
      doc: |-
        Binds an explicit identity to this element.

        Structural identity is normally derived from an element's type and its position among
        its siblings, so moving an element within a container gives it a new identity and forces
        re-setup. Use `id(_:)` when identity should follow the data instead of the position:

        ```swift
        ForEach(passes) { pass in
            pass.element
                .id(pass.name)
        }
        ```

        - Parameter id: A hashable value identifying this element.
        - Returns: An element with the explicit identity applied.
      source: Sources/MetalSprockets/Core/IdentifiedElement.swift:54
    - decl: |
        public func linkedFunctions(_ functions: [VisibleFunction]) -> some Element
      doc: |-
        Attaches a set of linked Metal functions for pipeline compilation.

        Use this modifier when your pipeline needs to call `[[visible]]` functions
        (including stitched functions) at runtime via a `visible_function_table`.
        The functions must be linked into the pipeline's descriptor so Metal can
        produce function handles for them.

        This value is read by ``RenderPipeline``, ``MeshRenderPipeline``, and
        ``ComputePass`` when building their pipeline descriptors. Apply this modifier
        to the pipeline — not to a child ``Draw`` — so the linked functions are
        available during pipeline state creation.

        ```swift
        RenderPipeline(vertexShader: vs, fragmentShader: fs) {
            Draw { encoder in ... }
                .visibleFunctionTable("colorFunction", function: stitchedFunction)
        }
        .linkedFunctions([stitchedFunction])
        ```

        - Parameter functions: The Metal functions to link into the pipeline.
        - Returns: A modified element with the linked functions set in the environment.
      source: Sources/MetalSprockets/Metal/VisibleFunctionTableModifier.swift:83
    - decl: |
        public func msaa(sampleCount: Int) -> some Element
      doc: |-
        Enables multisample anti-aliasing (MSAA) for render-to-texture rendering.

        Use this modifier when rendering to a custom texture and you want anti-aliasing.
        For on-screen rendering with `RenderView`, prefer using `.metalSampleCount()` on
        the SwiftUI view instead, as MTKView handles texture management automatically.

        - Parameter sampleCount: The number of samples per pixel (typically 2, 4, or 8).
          Use 1 to disable MSAA.

        ## Example

        ```swift
        RenderPass {
            RenderPipeline(vertexShader: vs, fragmentShader: fs) {
                Draw { encoder in
                    encoder.drawPrimitives(primitiveType: .triangle, vertexStart: 0, vertexCount: 3)
                }
            }
        }
        .msaa(sampleCount: 4)
        ```

        - Note: MSAA increases memory usage and has a performance cost. Higher sample
          counts provide better quality but at greater cost. 4x is a common balance.
      source: Sources/MetalSprockets/Metal/MSAAModifier.swift:207
    - decl: |
        public func onChange<V>(of value: V, initial: Bool = false, perform action: @escaping (V, V) -> Void) -> some Element where V : Equatable
      doc: |-
        Performs an action when a value changes.

        Use this modifier to respond to value changes during the render loop,
        similar to SwiftUI's `onChange`.

        ```swift
        struct AnimatedElement: Element {
            let frameCount: Int

            var body: some Element {
                MyContent()
                    .onChange(of: frameCount) { oldValue, newValue in
                        print("Frame changed from \(oldValue) to \(newValue)")
                    }
            }
        }
        ```

        - Parameters:
          - value: The value to observe.
          - initial: If `true`, the action is called on first render with the same value for old and new.
          - action: A closure called when the value changes, receiving old and new values.
      source: Sources/MetalSprockets/Core/OnChange.swift:64
