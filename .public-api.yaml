package: MetalSprockets
access_level: public
modules:
- name: MetalSprockets
  symbols:
  - decl: public protocol Element
    doc: |-
      The fundamental building block of MetalSprockets render graphs.

      `Element` is analogous to SwiftUI's `View` protocol. Elements can represent many things:
      GPU work (render passes, pipelines, draw commands), organizational containers (``Group``,
      ``ForEach``), or modifiers that configure child elements. Elements compose together
      to form a declarative render graph.

      ## Creating Custom Elements

      Conform to `Element` and implement the `body` property to compose other elements.
      Use ``ElementBuilder`` to combine multiple child elements:

      ```swift
      struct MyTriangle: Element {
          var body: some Element {
              RenderPass {
                  RenderPipeline(vertexShader: vs, fragmentShader: fs) {
                      Draw { encoder in
                          // Issue draw commands
                      }
                  }
              }
          }
      }
      ```

      ## Topics

      ### Core Elements
      - ``RenderPass``
      - ``RenderPipeline``
      - ``Draw``
      - ``ComputePass``

      ### State Management
      - ``MSState``
      - ``MSBinding``
      - ``MSEnvironment``
    source: Sources/MetalSprockets/Core/Element.swift:44
    members:
    - decl: |
        public func barrierAfterPass(after: MTLStages, beforeQueueStages: MTLStages, visibility: MTL4VisibilityOptions = .device) -> some Element
      doc: |-
        Ends each pass inside this element with a producer barrier: later queue work at `beforeQueueStages` waits for
        this pass's `after` stages.

        Use it on the pass that produces something a later pass reads (the alternative is a ``QueueBarrier`` at the
        start of the consumer):

        ```swift
        try ComputePass { ... }
            .barrierAfterPass(after: .dispatch, beforeQueueStages: .fragment)
        try RenderPass { ... }   // samples what the compute pass wrote
        ```
      source: Sources/MetalSprockets/Metal/BarrierElements.swift:97
    - decl: |
        public func capture(_ enabled: Bool = true, target: CaptureTarget = .device, destination: MTLCaptureDestination = .developerTools, outputURL: URL? = nil) -> some Element
      doc: |-
        Captures the GPU work of the submission this element encodes into, for Xcode's frame debugger or a `.gputrace`.

        The capture starts when the element's workload begins and stops once the submission completes (or is
        discarded), so it covers the whole submitted command buffer. A capture that is already running elsewhere is left
        alone.

        ```swift
        try RenderPass {
            // render content
        }
        .capture()
        ```

        > Important: On Metal 4 the capture must wrap whole passes. Placing it inside a ``RenderPass`` or ``ComputePass``
        > is a configuration error.

        > Important: For `.developerTools` captures, the host process must have `MTL_CAPTURE_ENABLED=1` (Xcode sets it
        > when launching with GPU frame capture enabled). Shader logging (`MS_METAL_LOGGING`) disables capture for the
        > whole process.

        - Parameters:
          - enabled: When `false`, the modifier is a no-op. Defaults to `true`.
          - target: Whether to capture all work on the device or only the root's queue. Defaults to ``CaptureTarget/device``.
          - destination: The capture destination. Defaults to `.developerTools`.
          - outputURL: Where to write the `.gputrace` file. Required for `.gpuTraceDocument`, ignored otherwise.
      source: Sources/MetalSprockets/Metal/CaptureModifier.swift:41
