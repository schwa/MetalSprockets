# Buildkite pipeline for MetalSprockets.
#
# Runs on a self-hosted Apple silicon Mac, so GPU tests run on real hardware instead of GitHub's paravirtual GPU.
# Agent setup: Documentation/Buildkite.md.

# The cluster routes jobs by queue. Every agent on this queue must be an Apple silicon Mac with Xcode.
agents:
  queue: "default-queue"

steps:
  - label: ":swift: Lint"
    key: "lint"
    command: "swiftlint --strict"

  - label: ":metal: Test (macOS)"
    key: "test"
    # One GPU test run at a time on an agent, so parallel builds don't compete for the GPU.
    concurrency: 1
    concurrency_group: "metalsprockets/gpu-tests"
    # No MTL_DEBUG_LAYER here: API Validation aborts on a size-less ComputeDispatch (2D default threadgroup for a 1D
    # kernel). The metal4 branch fixes that and turns validation on.
    command:
      - "swift build -Xswiftc -warnings-as-errors --disable-sandbox"
      - "swift test -Xswiftc -warnings-as-errors --disable-sandbox"

  - label: ":hammer: Example ({{matrix}})"
    key: "example"
    # DerivedData lives in the checkout, so jobs on different agents never share (and lock) one build database.
    matrix:
      - "platform=macOS"
      - "generic/platform=iOS"
      - "generic/platform=xrOS"
    command: >-
      xcodebuild build
      -project Example/MetalSprockets-Example.xcodeproj
      -scheme MetalSprockets-Example
      -destination '{{matrix}}'
      -derivedDataPath .derivedData
      -skipPackagePluginValidation
      -skipMacroValidation
      CODE_SIGNING_ALLOWED=NO

  - label: ":books: Public API snapshot"
    key: "api-check"
    # The committed snapshot is generated by GitHub Actions (Xcode 26.6, crates.io swift-api-tool 0.2.0). Other Xcode
    # versions print types differently, so a mismatch here is informational (#391). GitHub's api-check is the gate.
    soft_fail: true
    command:
      # `cargo install` puts the tool in ~/.cargo/bin, which a service's PATH usually lacks.
      - 'export PATH="$$HOME/.cargo/bin:$$PATH"'
      - "swift-api-tool . -o \"$$BUILDKITE_BUILD_CHECKOUT_PATH/.public-api.generated.yaml\""
      - "diff -u .public-api.yaml .public-api.generated.yaml"
