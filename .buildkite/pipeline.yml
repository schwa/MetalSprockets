# Generated by: xcb ci generate --target buildkite --warnings-as-errors --no-parallel
agents:
  queue: "default-queue"

steps:
  - label: ":swift: Lint"
    key: "lint"
    command: "swiftlint --strict"

  - label: ":metal: Test (macOS, {{matrix.configuration}})"
    key: "test"
    concurrency: 1
    concurrency_group: "metalsprockets/gpu-tests"
    env:
      MTL_DEBUG_LAYER: "1"
    matrix:
      setup:
        configuration:
          - "debug"
          - "release"
    command:
      - "swift build -c {{matrix.configuration}} -Xswiftc -warnings-as-errors --disable-sandbox"
      - "swift test -c {{matrix.configuration}} -Xswiftc -enable-testing -Xswiftc -warnings-as-errors --disable-sandbox --no-parallel"

  - label: ":hammer: Example ({{matrix.destination}}, {{matrix.configuration}})"
    key: "example"
    matrix:
      setup:
        destination:
          - "platform=macOS"
          - "generic/platform=iOS"
          - "generic/platform=xrOS"
        configuration:
          - "Debug"
          - "Release"
    command: >-
      xcodebuild build
      -project Example/MetalSprockets-Example.xcodeproj
      -scheme MetalSprockets-Example
      -configuration '{{matrix.configuration}}'
      -destination '{{matrix.destination}}'
      -skipPackagePluginValidation
      -skipMacroValidation
      CODE_SIGNING_ALLOWED=NO

